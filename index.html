<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTM AI Self-Assessment</title>
<meta name="description" content="A 10-minute self-assessment for go-to-market teams: find your workflow strengths, where AI can give you time back, and your recommended AI Day breakout.">
<meta name="theme-color" content="#4f46e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#4f46e5; --accent-600:#4338ca; --accent-700:#3730a3; --accent-50:#eef2ff; --accent-100:#e0e7ff; --accent-200:#c7d2fe;
  --teal:#0f766e; --teal-50:#f0fdfa; --teal-100:#ccfbf1;
  --amber:#b45309; --amber-50:#fffbeb; --amber-100:#fef3c7;
  --ink:#0f172a; --ink-2:#1e293b; --muted:#475569; --muted-2:#64748b; --line:#e2e8f0; --line-2:#cbd5e1;
  --bg:#f8fafc; --card:#ffffff; --good:#047857; --good-50:#ecfdf5; --bad:#b91c1c; --bad-50:#fef2f2;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
  --shadow-lg:0 2px 4px rgba(15,23,42,.05),0 12px 32px rgba(15,23,42,.10);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);line-height:1.5;font-size:16px;
  background:radial-gradient(1100px 520px at 50% -120px,#e0e7ff 0%,rgba(224,231,255,0) 70%),radial-gradient(700px 420px at 100% 0,#ccfbf1 0%,rgba(204,251,241,0) 70%),#f6f8fc;background-repeat:no-repeat;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent-600)}
h1,h2,h3,h4{line-height:1.2;margin:0;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;background:none;border:0;padding:4px;cursor:pointer;font-family:inherit}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0d9488);display:grid;place-items:center;color:#fff;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-50);color:var(--accent-700);white-space:nowrap}
.pill.teal{background:var(--teal-50);color:var(--teal)}
.pill.amber{background:var(--amber-50);color:var(--amber)}
.progress-wrap{height:4px;background:transparent}
.progress{height:4px;background:linear-gradient(90deg,var(--accent),#0d9488);width:0;transition:width .35s ease}

main{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
.narrow{max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.stack>*+*{margin-top:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:12.5px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-600)}
.eyebrow.teal{color:var(--teal)}
.eyebrow.amber{color:var(--amber)}

/* Buttons */
.btn{appearance:none;font-family:inherit;font-size:15px;font-weight:600;border-radius:12px;padding:12px 18px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.3),0 4px 12px rgba(79,70,229,.25)}
.btn.primary:hover{background:var(--accent-600)}
.btn.secondary{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent-700)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:#f1f5f9;color:var(--ink)}
.btn svg{width:18px;height:18px;flex-shrink:0}

/* Landing */
.hero{text-align:center;max-width:760px;margin:8px auto 28px}
.hero h1{font-size:clamp(30px,5vw,44px);font-weight:800;margin:14px 0 12px;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,var(--accent),#0d9488);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:clamp(16px,2.2vw,18px);color:var(--muted);max-width:640px;margin:0 auto}
.assess-list{display:grid;gap:16px;max-width:760px;margin:0 auto}
.assess{display:flex;gap:18px;align-items:flex-start;text-align:left;width:100%;font-family:inherit;color:inherit;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s,transform .15s}
.assess:hover{box-shadow:var(--shadow-lg);border-color:var(--accent-200);transform:translateY(-1px)}
.assess.featured{border-color:var(--accent-200);background:linear-gradient(180deg,#fff, #fafaff)}
.assess-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-50);color:var(--accent)}
.assess-icon.teal{background:var(--teal-50);color:var(--teal)}
.assess-icon svg{width:26px;height:26px}
.assess h2{font-size:19px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.assess h2 svg{width:20px;height:20px;color:var(--muted-2);flex-shrink:0}
.assess .desc{color:var(--muted);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted-2);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:16px;height:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--accent-50);color:var(--accent-700);font-weight:500}
.tag.strong{background:var(--accent);color:#fff;font-weight:700;letter-spacing:.03em}
.tag.teal{background:var(--teal-50);color:var(--teal)}
.tag.teal.strong{background:var(--teal);color:#fff}
.status{margin-top:12px;font-size:13.5px;padding:8px 12px;border-radius:10px;background:#f8fafc;border:1px dashed var(--line-2);color:var(--muted)}
.status.ok{background:var(--good-50);border-color:#a7f3d0;color:var(--good)}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--amber-50);border:1px solid #fde68a;color:#78350f;border-radius:14px;padding:14px 16px;font-size:15px}
.notice svg{width:22px;height:22px;flex-shrink:0;margin-top:1px;color:var(--amber)}
.notice.info{background:var(--accent-50);border-color:var(--accent-200);color:var(--accent-700)}
.notice.info svg{color:var(--accent)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:28px auto 0}
.step4{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:14px}
.step4 b{display:flex;align-items:center;gap:8px;font-size:14px}
.step4 b i{font-style:normal;width:22px;height:22px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
.step4 p{font-size:13px;color:var(--muted);margin-top:6px}
.saved-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.foot{text-align:center;color:var(--muted-2);font-size:13px;margin-top:28px}

/* Question screens */
.q-head{margin-bottom:18px}
.q-head h1{font-size:clamp(22px,3.4vw,28px);font-weight:800;margin-top:6px}
.q-head p{color:var(--muted);margin-top:8px}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;color:var(--muted-2);margin-bottom:10px}
.q{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:20px;margin:0 0 14px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.q.answered{border-color:var(--accent-200)}
.q.missing{border-color:#fca5a5;box-shadow:0 0 0 3px #fee2e2}
.q legend{padding:0;font-weight:600;font-size:16.5px;line-height:1.45;display:block;width:100%;float:left;margin-bottom:14px}
.q legend+*{clear:both}
.qnum{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--accent-50);color:var(--accent-700);font-size:13px;font-weight:700;margin-right:10px;vertical-align:1px;padding:0 6px}
.tag-drain{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--amber);background:var(--amber-50);border:1px solid #fde68a;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.tag-drain svg{width:12px;height:12px}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;z-index:1;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;min-height:64px;padding:8px 4px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;transition:all .12s;user-select:none}
.opt span b{font-size:18px;font-weight:700;color:var(--ink-2)}
.opt span small{font-size:11.5px;color:var(--muted-2);line-height:1.2}
.opt:hover span{border-color:var(--accent);background:var(--accent-50)}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);box-shadow:0 2px 8px rgba(79,70,229,.3)}
.opt input:checked+span b,.opt input:checked+span small{color:#fff}
.opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.scale-ends{display:none;justify-content:space-between;font-size:12px;color:var(--muted-2);margin-top:6px}
.choices{display:grid;gap:8px}
.choice{position:relative;display:block;cursor:pointer}
.choice input{position:absolute;z-index:1;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice span{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;transition:all .12s;font-size:15px}
.choice span::before{content:"";width:18px;height:18px;border-radius:999px;border:2px solid var(--line-2);flex-shrink:0;background:#fff;transition:all .12s}
.choice:hover span{border-color:var(--accent);background:var(--accent-50)}
.choice input:checked+span{border-color:var(--accent);background:var(--accent-50);color:var(--accent-700);font-weight:600}
.choice input:checked+span::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px #fff}
.choice input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.role span{flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px 14px 44px;position:relative;min-height:72px;justify-content:center}
.role span::before{position:absolute;left:14px;top:50%;margin-top:-9px}
.role span b{font-size:15.5px}
.role span small{font-size:13px;color:var(--muted-2);font-weight:400}
.field{display:grid;gap:6px;margin-top:4px}
.field label{font-weight:600;font-size:15px}
.input{font-family:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-100)}
.nav{position:sticky;bottom:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,248,252,0),rgba(246,248,252,.96) 30%)}
.nav .count{font-size:13.5px;color:var(--muted-2);text-align:center}
.nav .err{color:var(--bad);font-weight:600}

/* Results */
.res-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.res-head h1{font-size:clamp(26px,4vw,34px);font-weight:800;margin-top:6px}
.res-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.span-12{grid-column:span 12}.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-6{grid-column:span 6}
.persona{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent-700),var(--accent) 55%,#0d9488);color:#fff;border:0}
.persona .eyebrow{color:rgba(255,255,255,.8)}
.persona h2{font-size:clamp(28px,4.5vw,38px);font-weight:800;margin:6px 0 8px}
.persona p{color:rgba(255,255,255,.92);max-width:62ch}
.persona-top{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ladder{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.ladder span{font-size:12.5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);font-weight:600}
.ladder span.on{background:#fff;color:var(--accent-700)}
.gauge{width:120px;height:120px;flex-shrink:0}
.flu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;margin-top:18px}
.flu-item{font-size:13px}
.flu-item .row{display:flex;justify-content:space-between;gap:6px;color:rgba(255,255,255,.9);margin-bottom:4px}
.bar{height:6px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:999px}
.next-step{margin-top:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 14px;font-size:14.5px}
.guard{margin-top:10px;background:rgba(255,251,235,.95);color:#78350f;border-radius:12px;padding:12px 14px;font-size:14px}
.card h3{font-size:18px;font-weight:700}
.card-sub{color:var(--muted);font-size:14.5px;margin-top:4px}
.radar-wrap{display:flex;justify-content:center;margin-top:8px}
.radar-wrap svg{width:100%;max-width:520px;height:auto;overflow:visible}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.stage-list{display:grid;gap:12px;margin-top:14px}
.stage-row .top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;margin-bottom:6px}
.stage-row .top b{font-weight:600}
.stage-row .bar{background:#eef2f7;height:8px}
.stage-row .bar i{background:linear-gradient(90deg,var(--accent),#0d9488)}
.stage-row.low .bar i{background:linear-gradient(90deg,#f59e0b,#d97706)}
.score{font-variant-numeric:tabular-nums;font-weight:700}
.delta{font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px}
.delta.up{background:var(--good-50);color:var(--good)}
.delta.down{background:var(--bad-50);color:var(--bad)}
.delta.flat{background:#f1f5f9;color:var(--muted)}
.ins-col h3{display:flex;align-items:center;gap:10px}
.ins-col h3 .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.ins-col h3 .ic svg{width:18px;height:18px}
.ic.good{background:var(--teal-50);color:var(--teal)}
.ic.amber{background:var(--amber-50);color:var(--amber)}
.stage-block{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;background:#fff}
.stage-block h4{font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stage-block .lead{font-size:13.5px;color:var(--muted);margin-top:4px}
.uc{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}
.uc li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14.5px}
.uc li svg{width:18px;height:18px;margin-top:2px;color:var(--accent)}
.uc li b{display:block;font-weight:600}
.uc li span{color:var(--muted)}
.amplify .uc li svg{color:var(--teal)}
details.prompt{margin-top:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
details.prompt summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;color:var(--accent-700);list-style:none;display:flex;align-items:center;gap:8px}
details.prompt summary::-webkit-details-marker{display:none}
details.prompt summary::before{content:"▸";transition:transform .15s}
details.prompt[open] summary::before{transform:rotate(90deg)}
details.prompt pre{margin:0;padding:0 14px 12px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--ink-2);line-height:1.55}
details.prompt .copy-prompt{margin:0 14px 12px}
.breakout{border:2px solid var(--accent-200);background:linear-gradient(180deg,#fff,var(--accent-50))}
.breakout-top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.track-badge{width:64px;height:64px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.track-badge svg{width:30px;height:30px}
.breakout h2{font-size:clamp(22px,3.4vw,28px);font-weight:800;margin:4px 0 6px}
.bring{display:flex;gap:10px;align-items:flex-start;margin-top:14px;background:#fff;border:1px dashed var(--accent-200);border-radius:12px;padding:12px 14px;font-size:14.5px}
.bring svg{width:20px;height:20px;color:var(--accent);flex-shrink:0;margin-top:1px}
.alt{font-size:14px;color:var(--muted);margin-top:10px}
.habits{display:grid;gap:8px;margin-top:14px}
.habit span{align-items:flex-start}
.habit span::before{margin-top:2px}
.saved-msg{font-size:13.5px;color:var(--good);font-weight:600;min-height:20px;margin-top:8px}
.habit-chosen{display:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.compare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.kpi .lbl{font-size:12.5px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-size:22px;font-weight:800;margin-top:4px}
.kpi .sub{font-size:13px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:2px}
.pair .stage-block{margin-top:12px}
.card.snap{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:0;padding:0;overflow:hidden}
.snap>div{padding:16px 20px;border-right:1px solid var(--line)}
.snap>div:last-child{border-right:0;background:var(--accent-50)}
.snap .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);display:flex;align-items:center;gap:6px}
.snap .lbl svg{width:14px;height:14px}
.snap .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.chip.good{background:var(--teal-50);color:var(--teal);border:1px solid var(--teal-100)}
.chip.amber{background:var(--amber-50);color:var(--amber);border:1px solid #fde68a}
.snap .track{font-weight:800;font-size:16px;color:var(--accent-700);margin-top:6px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.print-only{display:none}

/* Facilitator */
.fac table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.fac th,.fac td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.fac th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2)}
.fac pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:12px;overflow:auto;font-size:12.5px;line-height:1.5}
.fac code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.fac ol,.fac ul{padding-left:20px;margin:8px 0 0}
.fac li{margin:4px 0}
.table-scroll{overflow-x:auto}

@media (max-width:820px){
  .span-7,.span-5,.span-6{grid-column:span 12}
  .pair{grid-template-columns:1fr}
  .card.snap{grid-template-columns:1fr}
  .snap>div{border-right:0;border-bottom:1px solid var(--line);padding:14px 18px}
  .snap>div:last-child{border-bottom:0}
  .steps4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  main{padding:18px 14px 56px}
  .card{padding:18px}
  .q{padding:16px}
  .assess{padding:18px;gap:14px}
  .assess-icon{width:44px;height:44px}
  .roles{grid-template-columns:1fr}
  .opt span{min-height:52px}
  .opt span small{display:none}
  .scale-ends{display:flex}
  .flu-grid{grid-template-columns:repeat(2,1fr);gap:10px 14px}
  .flu-item{font-size:12.5px}
  .compare-grid{grid-template-columns:1fr}
  .gauge{width:96px;height:96px}
  .topbar-inner{padding:10px 14px}
  .brand .t{display:none}
  .nav .btn{padding:12px 14px}
  .actions .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{
  @page{margin:12mm}
  body{background:#fff;font-size:12px}
  .topbar,.no-print,.nav,.toast,.skip{display:none!important}
  .print-only{display:block}
  main{padding:0;max-width:none}
  .card,.stage-block,.kpi{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .persona{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .res-grid{display:block}
  .res-grid>*{margin-bottom:12px}
  details.prompt{display:none}
  .habits.has-choice .habit:not(.is-chosen){display:none}
  .habit-chosen{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function roleById(id) { for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i]; return null; }
function stageById(id) { for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === id) return STAGES[i]; return null; }
function stageLabel(id, role) { var o = STAGE_LABELS[role] && STAGE_LABELS[role][id]; return o ? o[0] : stageById(id).label; }
function stageShort(id, role) { var o = STAGE_LABELS[role] && STAGE_LABELS[role][id]; return o ? o[1] : stageById(id).short; }
function aQuestions(stage, role) {
  var g = QA[stage].generic, r = QA[stage][role] || [];
  return [0, 1, 2].map(function (i) { return { id: stage + '_' + (i + 1), text: r[i] || g[i], drain: i === 2, type: 'likert' }; });
}
function useCases(stage, role) { return (UC[stage][role] || UC[stage].generic); }
function habitsFor(stage, role) { return (stage === 'growth' && role === 'mgr') ? HABITS.growth_mgr : HABITS[stage]; }
function promptFor(stage, role) {
  var p = (stage === 'growth' && role === 'mgr') ? PROMPTS.growth_mgr : PROMPTS[stage];
  var r = roleById(role); return p.replace('{role}', r ? r.label : 'GTM professional');
}
function toIndex(avg) { return Math.round((avg - 1) / 4 * 100); }
function personaFor(score) { var p = PERSONAS[0]; PERSONAS.forEach(function (x) { if (score >= x.min) p = x; }); return p; }
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return iso; } }
function modeLabel(m) { return m === 'checkin' ? 'Check-in' : 'Baseline'; }
function totalQuestions() { return STAGES.length * 3 + QB.length; }
function daysLabel() { return CONFIG.checkinDays.join(' & ') + ' days'; }

}

/* =====================================================================
   RENDER: QUESTIONS
   ===================================================================== */
function questionsForStep(step) {
  var key = STEPS[step];
  if (key.indexOf('A:') === 0) return aQuestions(key.slice(2), state.role);
  if (key === 'B:0') return QB.slice(0, 3);
  if (key === 'B:1') return QB.slice(3);
  return [];
}
function questionNumberOffset(step) {
  var n = 0; for (var s = 1; s < step; s++) n += questionsForStep(s).length; return n;
}
function answeredCount() {
  var n = 0; for (var s = 1; s < STEPS.length; s++) questionsForStep(s).forEach(function (q) { if (state.answers[q.id]) n++; }); return n;
}

function likertHTML(q, num) {
  var v = state.answers[q.id];
  var opts = LIKERT.map(function (lbl, i) {
    var val = i + 1;
    return '<label class="opt"><input type="radio" name="' + q.id + '" value="' + val + '"' + (v === val ? ' checked' : '') + ' aria-label="' + val + ' \u2013 ' + lbl + '"><span><b>' + val + '</b><small>' + lbl + '</small></span></label>';
  }).join('');
  return '<fieldset class="q' + (v ? ' answered' : '') + '" data-qid="' + q.id + '">' +
    '<legend><span class="qnum">' + num + '</span>' + esc(q.text) + (q.drain ? ' <span class="tag-drain" title="This one is about time spent: agree if it drains your time">' + I.hourglass + 'Time check</span>' : '') + '</legend>' +
    '<div class="likert">' + opts + '</div>' +
    '<div class="scale-ends" aria-hidden="true"><span>1 = Strongly disagree</span><span>5 = Strongly agree</span></div>' +
  '</fieldset>';
}
function choiceHTML(q, num) {
  var v = state.answers[q.id];
  var opts = q.options.map(function (lbl, i) {
    var val = i + 1;
    return '<label class="choice"><input type="radio" name="' + q.id + '" value="' + val + '"' + (v === val ? ' checked' : '') + '><span>' + esc(lbl) + '</span></label>';
  }).join('');
  return '<fieldset class="q' + (v ? ' answered' : '') + '" data-qid="' + q.id + '">' +
    '<legend><span class="qnum">' + num + '</span>' + esc(q.text) + '</legend>' +
    '<div class="choices">' + opts + '</div></fieldset>';
}

function navHTML(isLast) {
  var c = answeredCount(), n = totalQuestions();
  return '<div class="nav">' +
    '<button class="btn ghost" data-act="back">' + I.arrowL + 'Back</button>' +
    '<span class="count" id="navCount">' + c + ' of ' + n + ' answered</span>' +
    '<button class="btn primary" data-act="next">' + (isLast ? 'See my results' : 'Next') + I.arrowR + '</button>' +
  '</div>';
}

function renderRole() {
  var roles = ROLES.map(function (r) {
    return '<label class="choice role"><input type="radio" name="role" value="' + r.id + '"' + (state.role === r.id ? ' checked' : '') + '><span><b>' + esc(r.label) + '</b><small>' + esc(r.desc) + '</small></span></label>';
  }).join('');
  return '<div class="stepper"><span>Step 1 of ' + STEPS.length + '</span><span class="pill ' + (state.mode === 'checkin' ? 'teal' : '') + '">' + modeLabel(state.mode) + '</span></div>' +
    '<div class="q-head"><span class="eyebrow">Getting started</span><h1>What\u2019s your role?</h1><p>We\u2019ll tailor the questions and AI recommendations to the work you actually do. Pick the closest fit.</p></div>' +
    '<fieldset class="q" data-qid="role" style="padding:16px"><legend class="sr-only">Your role</legend><div class="roles">' + roles + '</div></fieldset>' +
    '<div class="card" style="padding:18px"><div class="field"><label for="nameInput">Your first name <span class="muted" style="font-weight:400">(optional, stored only on this device)</span></label>' +
    '<input id="nameInput" class="input" type="text" autocomplete="given-name" maxlength="40" value="' + esc(state.name) + '" placeholder="e.g. Alex"></div></div>' +
    (state.mode === 'checkin' && store.get('baseline') ? '<p class="small muted" style="margin-top:12px">Tip: choose the same role as your baseline (' + esc(roleById(store.get('baseline').role).label) + ') for a clean comparison.</p>' : '');
}

function renderStep() {
  var key = STEPS[state.step];
  var isLast = state.step === STEPS.length - 1;
  setProgress(state.step / STEPS.length * 100);
  var html;
  if (key === 'role') {
    html = renderRole();
  } else {
    var qs = questionsForStep(state.step);
    var off = questionNumberOffset(state.step);
    var head;
    if (key.indexOf('A:') === 0) {
      var sid = key.slice(2), idx = STAGES.findIndex(function (s) { return s.id === sid; });
      head = '<div class="q-head"><span class="eyebrow">Section A \u00b7 Workflow strengths & friction \u00b7 ' + (idx + 1) + ' of ' + STAGES.length + '</span>' +
        '<h1>' + esc(stageLabel(sid, state.role)) + '</h1>' +
        (idx === 0 ? '<p>Rate how true each statement is for you <b>today</b>. Be honest: this is for you, not a performance review. Statements marked <span class="tag-drain" style="margin:0">' + I.hourglass + 'Time check</span> ask whether something drains your time.</p>' : '<p>How true is each statement for you today?</p>') +
        '</div>';
    } else {
      var part = key === 'B:0' ? 1 : 2;
      head = '<div class="q-head"><span class="eyebrow">Section B \u00b7 AI mindset & fluency \u00b7 ' + part + ' of 2</span>' +
        '<h1>' + (part === 1 ? 'How you use AI today' : 'How you work with AI') + '</h1>' +
        '<p>' + (part === 1 ? 'There are no wrong answers. This sets your starting point, not a grade.' : 'Last page. Three more questions and you\u2019ll see your results.') + '</p></div>';
    }
    html = '<div class="stepper"><span>Step ' + (state.step + 1) + ' of ' + STEPS.length + '</span><span class="pill ' + (state.mode === 'checkin' ? 'teal' : '') + '">' + modeLabel(state.mode) + ' \u00b7 ' + esc(roleById(state.role).short) + '</span></div>' + head +
      qs.map(function (q, i) { return q.type === 'choice' ? choiceHTML(q, off + i + 1) : likertHTML(q, off + i + 1); }).join('');
  }
  $app.innerHTML = '<div class="narrow">' + html + navHTML(isLast) + '</div>';
}

function stepComplete() {
  if (STEPS[state.step] === 'role') return !!state.role;
  return questionsForStep(state.step).every(function (q) { return !!state.answers[q.id]; });
}

function next() {
  if (!stepComplete()) {
    var first = null;
    if (STEPS[state.step] === 'role') { first = $app.querySelector('[data-qid="role"]'); first.classList.add('missing'); }
    else questionsForStep(state.step).forEach(function (q) {
      if (!state.answers[q.id]) { var el = $app.querySelector('[data-qid="' + q.id + '"]'); el.classList.add('missing'); if (!first) first = el; }
    });
    var c = document.getElementById('navCount');
    if (c) { c.innerHTML = '<span class="err">' + (STEPS[state.step] === 'role' ? 'Please choose a role' : 'Please answer all questions on this page') + '</span>'; }
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); var inp = first.querySelector('input'); if (inp) inp.focus({ preventScroll: true }); }
    return;
  }
  if (state.step < STEPS.length - 1) { state.step++; saveDraft(); go('quiz'); }
  else finish();
}
function back() {
  if (state.step > 0) { state.step--; saveDraft(); go('quiz'); }
  else go('landing');
}

/* =====================================================================
   SCORING
   ===================================================================== */
function computeResult() {
  var a = state.answers, scores = {};
  STAGES.forEach(function (s) {
    var avg = (a[s.id + '_1'] + a[s.id + '_2'] + (6 - a[s.id + '_3'])) / 3;
    scores[s.id] = toIndex(avg);
  });
  var fl = {}, sum = 0;
  QB.forEach(function (q) { fl[q.id] = toIndex(a[q.id]); sum += a[q.id]; });
  var fluency = toIndex(sum / QB.length);
  var focus = ROLE_FOCUS[state.role] || ROLE_FOCUS.ae;
  // Rank strongest -> weakest: higher score first; tie-break 1: less time drain = stronger;
  // tie-break 2: stages that are typically a bigger time sink for this role rank as weaker.
  var ranked = STAGES.map(function (s) { return s.id; }).sort(function (x, y) {
    return (scores[y] - scores[x]) || (a[x + '_3'] - a[y + '_3']) || (focus.indexOf(y) - focus.indexOf(x));
  });
  var persona = personaFor(fluency);
  return {
    v: 1, mode: state.mode, role: state.role, name: state.name || '', date: new Date().toISOString(),
    answers: JSON.parse(JSON.stringify(a)), stageScores: scores, fluency: fluency, fluencyItems: fl,
    persona: persona.name, top: ranked.slice(0, 2), bottom: ranked.slice(-2).reverse(),
    breakout: ranked[ranked.length - 1], breakoutTrack: TRACKS[ranked[ranked.length - 1]].name, habit: ''
  };
}

function finish() {
  var r = computeResult();
  if (state.mode === 'checkin') {
    var prev = store.get('checkin');
    if (prev && prev.habit) r.priorHabit = prev.habit;
  }
  store.set(state.mode, r);
  var hist = store.get('history') || []; hist.push(r); if (hist.length > 30) hist = hist.slice(-30); store.set('history', hist);
  store.del('draft');
  state.result = r;
  setProgress(100);
  go('results');
}

function saveResult(r) {
  store.set(r.mode, r);
  var hist = store.get('history') || [];
  for (var i = hist.length - 1; i >= 0; i--) { if (hist[i].date === r.date) { hist[i] = r; break; } }
  store.set('history', hist);
}

/* =====================================================================
   RADAR (inline SVG)
   ===================================================================== */
function radarSVG(r, base) {
  var compact = (window.innerWidth || 1024) < 600;
  var W = compact ? 440 : 560, H = compact ? 440 : 440, cx = W / 2, cy = H / 2 + 4, R = compact ? 118 : 145, n = STAGES.length;
  var fs = compact ? 17 : 15, fs2 = compact ? 16 : 14;
  function pt(i, v) { var ang = -Math.PI / 2 + i * 2 * Math.PI / n; var rr = R * v / 100; return [cx + rr * Math.cos(ang), cy + rr * Math.sin(ang)]; }
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-labelledby="radarTitle radarDesc"><title id="radarTitle">Workflow strengths radar chart</title><desc id="radarDesc">' +
    STAGES.map(function (s) { return esc(stageLabel(s.id, r.role)) + ': ' + r.stageScores[s.id] + (base ? ' (baseline ' + base.stageScores[s.id] + ')' : ''); }).join('; ') + '</desc>';
  [20, 40, 60, 80, 100].forEach(function (lvl) {
    var pts = STAGES.map(function (_, i) { return pt(i, lvl).map(function (x) { return x.toFixed(1); }).join(','); }).join(' ');
    out += '<polygon points="' + pts + '" fill="' + (lvl === 100 ? '#f8fafc' : 'none') + '" stroke="#e2e8f0" stroke-width="1"/>';
  });
  STAGES.forEach(function (_, i) { var p = pt(i, 100); out += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="#e2e8f0"/>'; });
  [50, 100].forEach(function (lvl) { var p = pt(0, lvl); out += '<text x="' + (p[0] + 5) + '" y="' + (p[1] + 4) + '" font-size="11" fill="#94a3b8">' + lvl + '</text>'; });
  function poly(res, fill, stroke, dash) {
    var pts = STAGES.map(function (s, i) { return pt(i, Math.max(res.stageScores[s.id], 3)).map(function (x) { return x.toFixed(1); }).join(','); }).join(' ');
    return '<polygon points="' + pts + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.5" stroke-linejoin="round"' + (dash ? ' stroke-dasharray="6 5"' : '') + '/>';
  }
  if (base) out += poly(base, 'rgba(148,163,184,.12)', '#94a3b8', true);
  out += poly(r, 'rgba(79,70,229,.18)', '#4f46e5', false);
  STAGES.forEach(function (s, i) { var p = pt(i, Math.max(r.stageScores[s.id], 3)); out += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5" fill="#fff" stroke="#4f46e5" stroke-width="2.5"/>'; });
  STAGES.forEach(function (s, i) {
    var p = pt(i, 122), ang = -Math.PI / 2 + i * 2 * Math.PI / n, cos = Math.cos(ang);
    var anchor = Math.abs(cos) < 0.2 ? 'middle' : (cos > 0 ? 'start' : 'end');
    var name = stageShort(s.id, r.role), parts = name.split(' & ');
    var lines = (compact && parts.length === 2 && anchor !== 'middle') ? [parts[0] + ' &', parts[1]] : [name];
    var lh = fs + 2, sin = Math.sin(ang);
    var dy = sin < -0.9 ? -6 - (lines.length - 1) * lh : (sin > 0.9 ? 14 : -(lines.length - 1) * lh / 2);
    var isTop = r.top.indexOf(s.id) >= 0, isLow = r.bottom.indexOf(s.id) >= 0;
    var color = isTop ? '#0f766e' : (isLow ? '#b45309' : '#334155');
    var x = p[0].toFixed(1);
    out += '<text x="' + x + '" y="' + (p[1] + dy).toFixed(1) + '" text-anchor="' + anchor + '" font-size="' + fs + '" font-weight="600" fill="' + color + '" font-family="Inter, system-ui, sans-serif">' + esc(lines[0]) +
      (lines[1] ? '<tspan x="' + x + '" dy="' + lh + '">' + esc(lines[1]) + '</tspan>' : '') +
      '<tspan x="' + x + '" dy="' + (fs2 + 4) + '" font-size="' + fs2 + '" font-weight="700" fill="' + color + '">' + r.stageScores[s.id] + (base ? deltaTxt(r.stageScores[s.id] - base.stageScores[s.id]) : '') + '</tspan></text>';
  });
  return out + '</svg>';
}
function deltaTxt(d) { return d === 0 ? ' (\u00b10)' : ' (' + (d > 0 ? '+' : '\u2212') + Math.abs(d) + ')'; }
function deltaChip(d) { var c = d > 0 ? 'up' : (d < 0 ? 'down' : 'flat'); return '<span class="delta ' + c + '">' + (d > 0 ? '+' : d < 0 ? '\u2212' : '\u00b1') + Math.abs(d) + '</span>'; }

function gaugeSVG(v) {
  var r = 46, c = 2 * Math.PI * r, off = c * (1 - v / 100);
  return '<svg class="gauge" viewBox="0 0 120 120" role="img" aria-label="AI fluency ' + v + ' out of 100"><circle cx="60" cy="60" r="' + r + '" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="10"/>' +
    '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 60 60)"/>' +
    '<text x="60" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#fff" font-family="Inter, system-ui, sans-serif">' + v + '</text>' +
    '<text x="60" y="82" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.8)" font-family="Inter, system-ui, sans-serif">AI fluency</text></svg>';
}

/* =====================================================================
   RENDER: RESULTS
   ===================================================================== */
function getBaselineFor(r) { if (r.mode !== 'checkin') return null; var b = store.get('baseline'); return (b && b.date !== r.date) ? b : null; }

function renderResults() {
  var r = state.result; if (!r) { go('landing'); return; }
  setProgress(100);
  var role = roleById(r.role), base = getBaselineFor(r), persona = personaFor(r.fluency);
  var hi = r.top, lo = r.bottom;
  var ladder = PERSONAS.map(function (p) { return '<span class="' + (p.name === persona.name ? 'on' : '') + '">' + esc(p.name) + '</span>'; }).join('');
  var fluItems = QB.map(function (q) { var v = r.fluencyItems[q.id]; return '<div class="flu-item"><div class="row"><span>' + esc(q.dim) + '</span><b>' + v + '</b></div><div class="bar"><i style="width:' + Math.max(v, 3) + '%"></i></div></div>'; }).join('');
  var guard = '';
  if (r.answers.f_verify <= 2 || r.answers.f_data <= 2) {
    guard = '<div class="guard">' + '<b>Guardrail first:</b> ' +
      (r.answers.f_verify <= 2 ? 'build the habit of checking AI facts, numbers and names against the source before anything reaches a customer. ' : '') +
      (r.answers.f_data <= 2 ? 'Ask your manager or enablement team which data is approved for which AI tools before you paste customer information.' : '') + '</div>';
  }

  var compareCard = '';
  if (r.mode === 'checkin') {
    if (base) {
      var dF = r.fluency - base.fluency;
      var stageDeltas = STAGES.map(function (s) { return { id: s.id, d: r.stageScores[s.id] - base.stageScores[s.id] }; });
      var best = stageDeltas.slice().sort(function (x, y) { return y.d - x.d; })[0];
      var bd = base.bottom[0];
      compareCard = '<section class="card span-12" aria-labelledby="cmpH"><span class="eyebrow teal">Progress since baseline</span><h3 id="cmpH" style="margin-top:4px">Baseline ' + esc(fmtDate(base.date)) + ' \u2192 Check-in ' + esc(fmtDate(r.date)) + '</h3>' +
        (base.role !== r.role ? '<p class="card-sub">Note: your baseline was taken as ' + esc(roleById(base.role).label) + ', so some questions were worded differently.</p>' : '') +
        '<div class="compare-grid">' +
          '<div class="kpi"><div class="lbl">AI fluency</div><div class="val">' + base.fluency + ' \u2192 ' + r.fluency + ' ' + deltaChip(dF) + '</div><div class="sub">' + esc(base.persona) + ' \u2192 ' + esc(r.persona) + '</div></div>' +
          '<div class="kpi"><div class="lbl">Biggest gain</div><div class="val" style="font-size:18px">' + esc(stageShort(best.id, r.role)) + ' ' + deltaChip(best.d) + '</div><div class="sub">' + (best.d > 0 ? 'Keep doing what you\u2019re doing here.' : 'No stage improved yet; that\u2019s useful to know.') + '</div></div>' +
          '<div class="kpi"><div class="lbl">Baseline focus area</div><div class="val" style="font-size:18px">' + esc(stageShort(bd, r.role)) + ' ' + deltaChip(r.stageScores[bd] - base.stageScores[bd]) + '</div><div class="sub">' + (base.habit ? 'Your habit: \u201c' + esc(base.habit) + '\u201d' : 'No habit was saved with your baseline.') + '</div></div>' +
        '</div><p class="small muted" style="margin-top:12px">The dashed grey shape on the radar is your baseline. Scores are self-ratings, so treat changes as a conversation starter, not a precise measurement.</p></section>';
    } else {
      compareCard = '<section class="notice info span-12">' + I.refresh + '<div>No baseline was found on this device, so there\u2019s nothing to compare against yet. This check-in is saved and future check-ins will compare with your <b>baseline</b> if you take one on this device.</div></section>';
    }
  }

  var stageRows = STAGES.map(function (s) {
    var v = r.stageScores[s.id], isLow = lo.indexOf(s.id) >= 0;
    return '<div class="stage-row' + (isLow ? ' low' : '') + '"><div class="top"><b>' + esc(stageLabel(s.id, r.role)) + '</b><span><span class="score">' + v + '</span>' + (base ? deltaChip(v - base.stageScores[s.id]) : '') + '</span></div><div class="bar"><i style="width:' + Math.max(v, 3) + '%"></i></div></div>';
  }).join('');

  function ucList(stage, n) {
    return '<ul class="uc">' + useCases(stage, r.role).slice(0, n).map(function (u) { return '<li>' + I.sparkle + '<div><b>' + esc(u[0]) + '</b><span>' + esc(u[1]) + '</span></div></li>'; }).join('') + '</ul>';
  }
  var supers = hi.map(function (sid) {
    return '<div class="stage-block amplify"><h4>' + esc(stageLabel(sid, r.role)) + '<span class="score" style="color:var(--teal)">' + r.stageScores[sid] + '</span></h4>' +
      '<p class="lead">' + (r.stageScores[sid] >= 60 ? 'You\u2019re strong here. Use AI to scale it, and share what works with your team.' : 'Your relative strength right now. Use AI to build on it.') + '</p>' + ucList(sid, 2) + '</div>';
  }).join('');
  var timeback = lo.map(function (sid, i) {
    return '<div class="stage-block"><h4>' + esc(stageLabel(sid, r.role)) + '<span class="score" style="color:var(--amber)">' + r.stageScores[sid] + '</span></h4>' +

function summaryText(r) {

  L.push('');
  L.push('AI persona: ' + r.persona + ' (AI fluency ' + r.fluency + '/100' + (base ? ', baseline ' + base.fluency : '') + ')');
  L.push('');
  L.push('Workflow strength index (0\u2013100):');
  STAGES.forEach(function (s) { L.push('\u2022 ' + stageLabel(s.id, r.role) + ': ' + r.stageScores[s.id] + (base ? deltaTxt(r.stageScores[s.id] - base.stageScores[s.id]) : '')); });
  L.push('');

  L.push('Recommended breakout: \u201c' + TRACKS[r.breakout].name + '\u201d (bring one real account or deal)');
  L.push('My 30-day AI habit: ' + (r.habit || '(not chosen yet)'));
  return L.join('\n');

function copyText(txt, okMsg) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) { }
    document.body.removeChild(ta); toast(ok ? okMsg : 'Couldn\u2019t copy automatically. Please select and copy manually.');
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function () { toast(okMsg); }, fallback);
  else fallback();
}

function toRow(r) {
  var m = { mode: r.mode, date: r.date, name: r.name, role: r.role, persona: r.persona, fluency: r.fluency, top_1: r.top[0], top_2: r.top[1], weakest_1: r.bottom[0], weakest_2: r.bottom[1], breakout: TRACKS[r.breakout].name, habit: r.habit };

  Object.keys(r.answers).forEach(function (k) { m[k] = r.answers[k]; });
  return CSV_COLS.map(function (c) { var v = m[c] == null ? '' : String(m[c]); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');

function toCSV(list) { return [CSV_COLS.join(',')].concat(list.map(toRow)).join('\n'); }
function download(name, text, type) {

}

function render() {
  if (state.screen === 'landing') renderLanding();
  else if (state.screen === 'quiz') renderStep();
  else if (state.screen === 'results') renderResults();
  else if (state.screen === 'facilitator') renderFacilitator();
}

function startAssessment(mode) {
  var base = store.get('baseline');
  state.mode = mode; state.answers = {}; state.step = 0; state.result = null;
  if (!state.role && base) state.role = base.role;
  if (!state.name && base && base.name) state.name = base.name;
  saveDraft(); go('quiz');
}

$app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  handleAct(b.getAttribute('data-act'), b);
});
document.querySelector('.topbar').addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (b) handleAct(b.getAttribute('data-act'), b);
});

function handleAct(act, b) {
  var r = state.result;
  switch (act) {
    case 'home': if (state.screen === 'facilitator') history.replaceState(null, '', location.pathname); go('landing'); break;
    case 'start': startAssessment(b.getAttribute('data-mode')); break;
    case 'resume': var d = store.get('draft'); if (d) { state.mode = d.mode; state.role = d.role; state.name = d.name || ''; state.answers = d.answers || {}; state.step = Math.min(d.step || 0, STEPS.length - 1); go('quiz'); } break;
    case 'view': state.result = store.get(b.getAttribute('data-mode')); if (state.result) go('results'); break;
    case 'next': next(); break;
    case 'back': back(); break;
    case 'print': window.print(); break;
    case 'copy': copyText(summaryText(r), 'Results summary copied'); break;
    case 'copyprompt': copyText(promptFor(b.getAttribute('data-stage'), r.role), 'Prompt copied'); break;
    case 'retake': state.role = r ? r.role : state.role; startAssessment(r ? r.mode : 'baseline'); break;
    case 'submit':
      if (!CONFIG.resultsEndpoint) return;
      fetch(CONFIG.resultsEndpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(r) })
        .then(function () { toast('Results sent. Thank you!'); }, function () { toast('Couldn\u2019t send. Please screenshot your results instead.'); });
      break;
    case 'exportjson': download('gtm-ai-assessment-results.json', JSON.stringify(allLocalResults(), null, 2), 'application/json'); break;
    case 'exportcsv': download('gtm-ai-assessment-results.csv', toCSV(allLocalResults()), 'text/csv'); break;
    case 'copyjson': copyText(JSON.stringify(allLocalResults(), null, 2), 'JSON copied'); break;
    case 'clearlocal':
      if (confirm('Delete all assessment results saved in this browser? This cannot be undone.')) { ['baseline', 'checkin', 'history', 'draft'].forEach(function (k) { store.del(k); }); renderFacilitator(); toast('Local data cleared'); }
      break;
    case 'exitfac': history.replaceState(null, '', location.pathname); go('landing'); break;
  }
}

$app.addEventListener('change', function (e) {
  var t = e.target;
  if (t.name === 'role') {
    state.role = t.value; saveDraft();
    var f = t.closest('.q'); if (f) f.classList.remove('missing');
    var c = document.getElementById('navCount'); if (c) c.textContent = answeredCount() + ' of ' + totalQuestions() + ' answered';
    return;
  }
  if (t.name === 'habit') {
    var r = state.result, wrap = document.getElementById('customHabitWrap');
    if (t.value === 'custom') { wrap.style.display = ''; var ci = document.getElementById('customHabit'); ci.focus(); r.habit = ci.value.trim(); }
    else { wrap.style.display = 'none'; r.habit = habitsFor(r.breakout, r.role)[+t.value]; }
    $app.querySelectorAll('.habit').forEach(function (l) { l.classList.toggle('is-chosen', l.querySelector('input').checked); });
    $app.querySelector('.habits').classList.toggle('has-choice', !!r.habit);
    saveResult(r); document.getElementById('habitSaved').textContent = r.habit ? 'Saved \u2713' : 'Type your habit below, it saves automatically';
    return;
  }
  if (t.type === 'radio' && t.closest('.q')) {
    state.answers[t.name] = +t.value; saveDraft();
    var fs = t.closest('.q'); fs.classList.add('answered'); fs.classList.remove('missing');
    var c2 = document.getElementById('navCount'); if (c2) c2.textContent = answeredCount() + ' of ' + totalQuestions() + ' answered';
    // gently bring the next unanswered question into view (pointer users only)
    if (!t.matches(':focus-visible')) {
      var all = Array.prototype.slice.call($app.querySelectorAll('.q[data-qid]'));
      var nextQ = all.slice(all.indexOf(fs) + 1).filter(function (x) { return !x.classList.contains('answered'); })[0];

      if (nextQ) setTimeout(function () { nextQ.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); }, 120);
    }
  }
});
